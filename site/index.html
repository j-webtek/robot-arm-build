<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#081014">
  <meta name="description" content="A 22-second overview of Tactevra's perceive, propose, check, execute, and verify architecture.">
  <title>Tactevra — System explainer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #081014;
      color: #f4f7f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background:
        radial-gradient(circle at 50% -20%, rgba(47, 205, 224, .18), transparent 45%),
        #081014;
    }
    main { width: min(100%, 76rem); }
    header { margin-bottom: 1rem; }
    .eyebrow {
      color: #6ed8e7;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: .35rem 0 .4rem;
      font-size: clamp(1.65rem, 4vw, 3rem);
      line-height: 1.06;
    }
    p { margin: 0; color: #b9c5ca; line-height: 1.55; }
    .player {
      margin-top: 1.3rem;
      overflow: hidden;
      border: 1px solid rgba(110, 216, 231, .28);
      border-radius: 1rem;
      background: #000;
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .42);
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      font-size: .9rem;
    }
    a { color: #6ed8e7; text-underline-offset: .2em; }
    .note { max-width: 52rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Tactevra · RC03</div>
      <h1>From user intent to a checked physical action</h1>
      <p>A concise overview of the measured workcell and its perceive, propose, check, execute, and verify architecture.</p>
    </header>

    <div class="player">
      <video controls playsinline preload="metadata" poster="media/tactevra-overview-poster.jpg">
        <source src="media/tactevra-overview.mp4" type="video/mp4">
        <track
          kind="captions"
          src="media/tactevra-overview.en.vtt"
          srclang="en"
          label="English"
          default>
        Your browser cannot play this video.
        <a href="media/tactevra-overview.mp4">Download the MP4 instead.</a>
      </video>
    </div>

    <footer>
      <p class="note">Presentation visualization only—not evidence of autonomous operation or physical qualification.</p>
      <a href="https://github.com/j-webtek/tactevra">View the repository</a>
    </footer>
  </main>
</body>
</html>
