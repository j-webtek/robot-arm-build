<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">RoCell static overhead camera general arrangement</title>
  <desc id="desc">Dimensioned screening schematic with top and side views of the RC03 placemat, front portal, overhead camera, required image envelope, and robot workspace screens.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <pattern id="boardHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#d7c29c" stroke-width="4"/>
    </pattern>
    <clipPath id="topClip"><rect x="45" y="175" width="700" height="700" rx="8"/></clipPath>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .head { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 10px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .dim { stroke: #334155; stroke-width: 1.4; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { stroke: #64748b; stroke-width: 1; stroke-dasharray: 3 3; }
      .steel { fill: #475569; stroke: #0f172a; stroke-width: 1.5; }
      .steel-line { fill: none; stroke: #334155; stroke-width: 8; stroke-linecap: square; }
      .candidate { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .screen { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 9 6; }
      .optical { fill: rgba(14,165,233,0.10); stroke: #0284c7; stroke-width: 2; stroke-dasharray: 7 5; }
      .datum { fill: #f59e0b; stroke: #92400e; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .tag { fill: #111827; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text x="48" y="48" class="title">G001 — STATIC OVERHEAD CAMERA GENERAL ARRANGEMENT</text>
  <text x="48" y="77" class="subtitle">RC03 board frame B • dimensions in millimetres • design ROCELL-STATIC-CAMERA-SUPPORT-CANDIDATE-001</text>
  <rect x="48" y="94" width="1504" height="48" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="70" y="124" class="label" fill="#9a3412">SCREENING CANDIDATE — not a fabrication, installation, powered-motion, or contact release. Verify received parts, STEP sweep, loads, focus, and calibration first.</text>

  <rect x="45" y="175" width="700" height="700" rx="8" class="panel"/>
  <text x="67" y="208" class="head">TOP VIEW — coordinate scale</text>
  <text x="67" y="230" class="small">+X right, +Y rear/toward arm. Low support feet extend only toward −Y.</text>

  <g clip-path="url(#topClip)">
    <!-- Provisional arm endpoint-radius screen: center (305,457), radius 560. -->
    <circle cx="416.4" cy="370.64" r="268.8" fill="#fee2e2" fill-opacity="0.25" class="screen"/>

    <!-- Required optical view: B X=-30..640, Y=-30..487. -->
    <rect x="255.6" y="356.24" width="321.6" height="248.16" class="optical"/>

    <!-- Nominal board: B X=0..610, Y=0..457. -->
    <rect x="270" y="370.64" width="292.8" height="219.36" fill="#f4e4c1" stroke="#7c5a2b" stroke-width="2"/>
    <rect x="270" y="370.64" width="292.8" height="219.36" fill="url(#boardHatch)" opacity="0.35"/>

    <!-- Device envelopes. -->
    <rect x="310.8" y="478.64" width="151.2" height="70.56" rx="4" fill="#e2e8f0" stroke="#475569"/>
    <text x="356" y="517" class="small">KEYBOARD</text>
    <rect x="509.62" y="470.67" width="37.39" height="78.91" rx="5" fill="#d1fae5" stroke="#047857"/>
    <text x="514" y="514" class="tiny" transform="rotate(-90 514 514)">PHONE</text>

    <!-- Existing tag tiles. -->
    <g>
      <rect x="279.36" y="557.6" width="26.4" height="26.4" class="tag"/><text x="285" y="574" class="tiny" fill="#fff">T0</text>
      <rect x="468" y="557.6" width="26.4" height="26.4" class="tag"/><text x="474" y="574" class="tiny" fill="#fff">T1</text>
      <rect x="279.36" y="380.0" width="26.4" height="26.4" class="tag"/><text x="285" y="396" class="tiny" fill="#fff">T2</text>
      <rect x="527.04" y="380.0" width="26.4" height="26.4" class="tag"/><text x="533" y="396" class="tiny" fill="#fff">T3</text>
      <rect x="412.32" y="428.48" width="26.4" height="26.4" class="tag"/><text x="418" y="445" class="tiny" fill="#fff">K0</text>
      <rect x="477.12" y="428.48" width="26.4" height="26.4" class="tag"/><text x="483" y="445" class="tiny" fill="#fff">P0</text>
    </g>

    <!-- Rear arm clamp opening. -->
    <line x1="378" y1="370.64" x2="454.8" y2="370.64" stroke="#7c3aed" stroke-width="8"/>
    <text x="362" y="350" class="small" fill="#6d28d9">factory clamp opening X=225..385</text>
    <circle cx="416.4" cy="370.64" r="7" fill="#dc2626"/>
    <text x="426" y="366" class="small" fill="#991b1b">provisional base axis (305,457)</text>

    <!-- Front portal lower/upper plan projection and forward feet. -->
    <line x1="224.4" y1="638" x2="608.4" y2="638" class="steel-line"/>
    <line x1="241.2" y1="638" x2="241.2" y2="830" class="steel-line"/>
    <line x1="591.6" y1="638" x2="591.6" y2="830" class="steel-line"/>
    <circle cx="241.2" cy="638" r="10" class="candidate"/>
    <circle cx="591.6" cy="638" r="10" class="candidate"/>

    <!-- High booms and bridge. -->
    <line x1="378" y1="638" x2="378" y2="446" stroke="#2563eb" stroke-width="10"/>
    <line x1="454.8" y1="638" x2="454.8" y2="446" stroke="#2563eb" stroke-width="10"/>
    <line x1="368.4" y1="480.32" x2="464.4" y2="480.32" stroke="#0284c7" stroke-width="9"/>
    <circle cx="416.4" cy="480.32" r="13" fill="#0ea5e9" stroke="#075985" stroke-width="2"/>
    <line x1="416.4" y1="480.32" x2="416.4" y2="590" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5 5"/>

    <!-- Board edge locator concept. -->
    <rect x="338" y="585" width="8" height="10" class="datum"/>
    <rect x="487" y="585" width="8" height="10" class="datum"/>
    <rect x="265" y="461" width="10" height="8" class="datum"/>
    <path d="M 318 367 l 0 10 M 514.8 367 l 0 10 M 558 465 l 10 0" stroke="#f97316" stroke-width="4"/>
  </g>

  <!-- Top view dimensions. -->
  <line x1="270" y1="370.64" x2="270" y2="322" class="ext"/><line x1="562.8" y1="370.64" x2="562.8" y2="322" class="ext"/>
  <line x1="270" y1="326" x2="562.8" y2="326" class="dim"/><text x="399" y="318" class="label">610 board</text>
  <line x1="562.8" y1="370.64" x2="614" y2="370.64" class="ext"/><line x1="562.8" y1="590" x2="614" y2="590" class="ext"/>
  <line x1="608" y1="370.64" x2="608" y2="590" class="dim"/><text x="618" y="486" class="label">457 board</text>
  <line x1="241.2" y1="638" x2="241.2" y2="681" class="ext"/><line x1="591.6" y1="638" x2="591.6" y2="681" class="ext"/>
  <line x1="241.2" y1="674" x2="591.6" y2="674" class="dim"/><text x="385" y="695" class="label">730 post axes</text>
  <line x1="210" y1="590" x2="210" y2="638" class="dim"/><text x="129" y="618" class="label">100 front offset</text>

  <g transform="translate(70 720)">
    <rect x="0" y="0" width="640" height="132" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="18" cy="24" r="7" fill="#0ea5e9"/><text x="34" y="29" class="small">camera axis B=(305, 228.5), nominal Z=1000</text>
    <line x1="10" y1="50" x2="30" y2="50" class="screen"/><text x="39" y="55" class="small">published 560 mm endpoint-radius screen; not full-body clearance</text>
    <line x1="10" y1="76" x2="30" y2="76" class="optical"/><text x="39" y="81" class="small">required calibrated view B X=-30..640, Y=-30..487</text>
    <rect x="10" y="96" width="16" height="12" class="datum"/><text x="39" y="107" class="small">candidate board edge datum/clamp, entirely at or below Z=0</text>
  </g>

  <rect x="780" y="175" width="775" height="700" rx="8" class="panel"/>
  <text x="802" y="208" class="head">SIDE VIEW — B Y / Z</text>
  <text x="802" y="230" class="small">Optical height is the entrance-pupil target; camera-body Z is finalized from the received STEP.</text>

  <!-- Side view coordinate baseline. Mapping: x=1025+0.7Y; Z levels are explicitly dimensioned. -->
  <line x1="840" y1="820" x2="1435" y2="820" stroke="#475569" stroke-width="2"/>
  <text x="844" y="844" class="small">Z=0 board/tag nominal plane</text>
  <rect x="1025" y="820" width="319.9" height="10" fill="#f4e4c1" stroke="#7c5a2b"/>

  <!-- Required view rays. -->
  <path d="M 1184.95 320 L 1004 820 L 1365.9 820 Z" fill="#bae6fd" fill-opacity="0.30" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="1184.95" y1="320" x2="1184.95" y2="820" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Published vertical screen and candidate overhead floor. -->
  <line x1="825" y1="431.1" x2="1518" y2="431.1" class="screen"/>
  <text x="836" y="421" class="small" fill="#991b1b">Z=798 published vertical maximum — screening only</text>
  <line x1="825" y1="364" x2="1518" y2="364" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="836" y="353" class="small" fill="#92400e">Z=920 lowest overhead-hardware screening floor</text>

  <!-- Front portal and high boom. -->
  <rect x="941" y="237.5" width="28" height="582.5" class="steel"/>
  <rect x="941" y="226.5" width="28" height="22" class="steel"/>
  <line x1="955" y1="237.5" x2="1235" y2="237.5" stroke="#2563eb" stroke-width="14"/>
  <line x1="955" y1="255" x2="1070" y2="237.5" stroke="#64748b" stroke-width="7"/>
  <text x="865" y="269" class="small">front portal</text>
  <text x="1054" y="221" class="small">400 high boom; structural centreline ≈ Z=1150</text>

  <!-- Camera and carriage, stylized but tied to known envelope. -->
  <line x1="1184.95" y1="237.5" x2="1184.95" y2="267" stroke="#334155" stroke-width="8"/>
  <rect x="1171" y="267" width="28" height="42" rx="2" fill="#475569" stroke="#0f172a"/>
  <path d="M 1176 309 L 1194 309 L 1191 320 L 1179 320 Z" fill="#0ea5e9" stroke="#075985"/>
  <circle cx="1184.95" cy="320" r="5" fill="#0ea5e9" stroke="#075985"/>
  <text x="1208" y="287" class="small">B0477 envelope proxy</text>
  <text x="1208" y="305" class="tiny">38 × 38; ≈86.8 lens-front-to-back</text>
  <text x="1208" y="324" class="tiny">entrance pupil B=(305,228.5,1000)</text>

  <!-- Robot location and published height arrow. -->
  <rect x="1318" y="792" width="54" height="28" rx="4" fill="#ddd6fe" stroke="#6d28d9"/>
  <path d="M 1345 792 C 1300 720, 1280 625, 1345 550 C 1385 505, 1390 468, 1345 431" fill="none" stroke="#7c3aed" stroke-width="7" opacity="0.75"/>
  <text x="1275" y="849" class="small">provisional arm axis Y=457</text>

  <!-- Height dimensions. -->
  <line x1="1422" y1="820" x2="1470" y2="820" class="ext"/><line x1="1185" y1="320" x2="1470" y2="320" class="ext"/>
  <line x1="1462" y1="820" x2="1462" y2="320" class="dim"/>
  <text x="1479" y="572" class="label" transform="rotate(-90 1479 572)">1000 nominal optical height</text>
  <line x1="1405" y1="820" x2="1405" y2="364" class="dim"/>
  <text x="1393" y="618" class="small" transform="rotate(-90 1393 618)">920 overhead floor</text>

  <!-- Horizontal side dimensions. -->
  <line x1="1025" y1="857" x2="1344.9" y2="857" class="dim"/>
  <line x1="1025" y1="820" x2="1025" y2="864" class="ext"/><line x1="1344.9" y1="820" x2="1344.9" y2="864" class="ext"/>
  <text x="1150" y="877" class="label">457 board depth</text>

  <rect x="48" y="900" width="710" height="150" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <text x="68" y="928" class="head">Critical geometry checks</text>
  <text x="68" y="955" class="label">• post-to-provisional-base distance: 665.94; required point screen = 560 + 50</text>
  <text x="68" y="980" class="label">• vertical residual after 100 mm screen: 920 − 798 − 100 = 22</text>
  <text x="68" y="1005" class="label">• B0477 aspect-conservative view at Z=1000: 911.45 × 607.64</text>
  <text x="68" y="1030" class="label">• 670 × 517 required view remains visible at the Z=950 lower adjustment screen</text>

  <rect x="780" y="900" width="775" height="150" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <text x="800" y="928" class="head">Do not release from this sheet</text>
  <text x="800" y="955" class="label">Measure board, bench, robot base/clamp, camera, entrance pupil, and cable first.</text>
  <text x="800" y="980" class="label">Import official RoArm and B0477 STEP; sweep startup + all tool/cable routes.</text>
  <text x="800" y="1005" class="label">Complete load, drift, focus, measured-FOV, USB-mode, lighting, and calibration gates.</text>
  <text x="800" y="1030" class="label">Exact cut lengths, holes, anchors, fasteners, and witness locations remain OPEN_BLOCKING.</text>

  <text x="48" y="1080" class="tiny">Sources: RC03 workcell_layout.json; robot_reach_screening.json; Arducam B0477 datasheet; Waveshare RoArm-M3 product data. Printed scale is not controlled—use stated dimensions and machine-readable contract.</text>
</svg>
