name: Offline verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    # Keep the established check labels while pinning the actual Linux image.
    # Branch protection keys off these names; the runner identity is reported
    # separately in the environment summary.
    name: Offline / ${{ matrix.check_os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check_os: ubuntu-latest
            python: '3.10'
          - runner: ubuntu-24.04
            check_os: ubuntu-latest
            python: '3.12'
          - runner: windows-latest
            check_os: windows-latest
            python: '3.10'
          - runner: windows-latest
            check_os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package in isolated environment
        run: |
          python -m venv .venv-ci
          python scripts/ci/offline_checks.py install-base
      - name: Verify installed package and documented offline demo
        run: python scripts/ci/offline_checks.py smoke
      - name: Check maintained documentation links and branding assets
        run: |
          python -m compileall -q scripts/ci
          python -m unittest discover -s scripts/ci -p "test_*.py"
          python scripts/ci/check_docs.py
          python scripts/ci/check_evidence_scope.py
          python scripts/ci/check_release_integrity.py --mode policy
      - name: Install test extra
        run: python scripts/ci/offline_checks.py install-tests
      - name: Summarize resolved verification environment
        run: python scripts/ci/offline_checks.py environment
      - name: Run bounded AI and arm contract tests
        run: python scripts/ci/offline_checks.py test
