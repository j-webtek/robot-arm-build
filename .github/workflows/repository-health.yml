name: Repository health

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: repository-health
  cancel-in-progress: true

jobs:
  public-drift:
    name: Public repository drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compare public GitHub state with policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/check_repository_health.py \
            --scope public \
            --repository "$GITHUB_REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Compare release ledger with tracker, milestone, and blocker issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/check_release_readiness_sync.py
          --online
          --repository "$GITHUB_REPOSITORY"
          --summary "$GITHUB_STEP_SUMMARY"
